<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#231810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nossos Passeios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#231810;--night-2:#2f2118;--night-3:#3d2c20;      /* fundos espresso quentes */
    --amber:#e8c07a;--amber-deep:#c99a4c;                      /* brass (painel de estacao) */
    --coat:#cf4230;--coat-deep:#a8321f;                        /* vermelho tijolo do casaco */
    --sage:#8ba86a;                                            /* verde-musgo (progresso) */
    --fur:#7a5334;                                             /* marrom quente */
    --rose:#cf4230;                                            /* coracao = vermelho tijolo */
    --cream:#f4e9d4;--muted:#b09a7f;--line:rgba(244,233,212,.10);--board-cell:#160f09;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--night);color:var(--cream);}
  body{
    font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;min-height:100dvh;
    background:
      radial-gradient(120% 55% at 50% -10%, rgba(207,66,48,.16), transparent 60%),
      radial-gradient(90% 50% at 88% 4%, rgba(232,192,122,.12), transparent 55%),
      radial-gradient(rgba(244,233,212,.022) 1px, transparent 1px),
      var(--night);
    background-size:auto,auto,4px 4px,auto;
    padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 40px);
    max-width:520px;margin:0 auto;
  }
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--amber);opacity:.6;}
  h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:400;
    font-size:clamp(34px,10vw,46px);line-height:1.02;letter-spacing:-.015em;margin-bottom:4px;}
  h1 em{font-style:italic;font-weight:500;color:var(--coat);}
  .sub{color:var(--muted);font-size:14.5px;max-width:34ch;}

  .progress-wrap{margin:22px 0 26px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;}
  .progress-top b{color:var(--cream);font-size:13px;}
  .progress-top .heart{color:var(--rose);}
  .bar{height:7px;background:var(--night-3);border-radius:99px;overflow:hidden;}
  .bar>span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#6f8f52,var(--sage));transition:width .7s cubic-bezier(.22,1,.36,1);}

  .board{position:relative;background:linear-gradient(180deg,var(--night-2),#191c30);
    border:1px solid var(--line);border-radius:22px;padding:26px 20px 22px;margin-bottom:20px;overflow:hidden;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(243,237,225,.04);}
  .board::before{content:"";position:absolute;inset:-40% 20% auto 20%;height:120px;
    background:radial-gradient(50% 100% at 50% 0,rgba(232,192,122,.24),transparent 70%);filter:blur(6px);pointer-events:none;}
  .board-label{position:relative;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:16px;}
  .flaps{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:5px 4px;min-height:52px;align-items:center;}
  .cell{font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(20px,6.4vw,27px);line-height:1;
    width:.72em;height:1.42em;display:flex;align-items:center;justify-content:center;
    background:var(--board-cell);color:var(--amber);border-radius:5px;border:1px solid rgba(0,0,0,.5);
    box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.9),inset 0 6px 8px -6px rgba(255,255,255,.05);position:relative;}
  .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);}
  .cell.flapping{animation:flap .18s linear;}
  .cell.space{background:transparent;border:none;box-shadow:none;width:.34em;}
  .cell.space::after{display:none;}
  @keyframes flap{0%{transform:translateY(-6%) scaleY(.9);}100%{transform:none;}}
  .board-meta{position:relative;display:flex;justify-content:center;gap:10px;margin-top:18px;min-height:26px;flex-wrap:wrap;}
  .chip{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.03em;background:var(--night-3);
    border:1px solid var(--line);color:var(--cream);padding:5px 12px;border-radius:99px;opacity:0;transform:translateY(6px);
    transition:opacity .4s,transform .4s;}
  .chip.show{opacity:1;transform:none;}
  .chip .u{color:var(--muted);}
  .board-empty{position:relative;text-align:center;color:var(--muted);font-size:14px;padding:6px 8px 2px;display:none;}

  .filter{margin-bottom:18px;}
  .filter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .filter-head label{font-size:14px;color:var(--cream);font-weight:500;}
  .filter-head .val{font-family:'Space Mono',monospace;color:var(--coat);font-size:15px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:7px;border-radius:99px;background:var(--night-3);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:var(--coat);border:3px solid var(--night);cursor:pointer;box-shadow:0 2px 10px rgba(207,66,48,.5);}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--coat);
    border:3px solid var(--night);cursor:pointer;box-shadow:0 2px 10px rgba(207,66,48,.5);}
  .range-scale{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;
    font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em;}
  .eligible{font-size:12.5px;color:var(--muted);margin-top:9px;text-align:center;}
  .eligible b{color:var(--cream);}

  .draw{width:100%;border:none;cursor:pointer;color:#fbeee2;font-weight:600;font-family:'DM Sans',sans-serif;
    font-size:17px;letter-spacing:.01em;padding:17px;border-radius:16px;margin:4px 0 8px;
    background:linear-gradient(180deg,var(--coat),var(--coat-deep));
    box-shadow:0 14px 30px -12px rgba(207,66,48,.6),inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .12s,box-shadow .2s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:10px;}
  .draw:active{transform:translateY(2px) scale(.99);box-shadow:0 8px 18px -12px rgba(207,66,48,.6);}
  .draw:disabled{opacity:.55;cursor:default;}
  .draw svg{width:19px;height:19px;}

  .actions{display:none;gap:10px;margin-top:6px;}
  .actions.show{display:flex;}
  .actions button,.actions a{flex:1;text-align:center;text-decoration:none;cursor:pointer;
    font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:500;padding:14px 10px;border-radius:14px;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .12s,background .2s,border-color .2s;}
  .actions button:active,.actions a:active{transform:translateY(1px);}
  .btn-route{background:var(--night-2);color:var(--cream);}
  .btn-route:active{background:var(--night-3);}
  .btn-visit{background:transparent;color:var(--rose);border-color:rgba(255,122,138,.4);}
  .btn-visit:active{background:rgba(255,122,138,.1);}
  .actions svg{width:16px;height:16px;}

  .list-section{margin-top:34px;}
  .list-toggle{width:100%;background:none;border:none;cursor:pointer;color:var(--cream);
    display:flex;align-items:center;justify-content:space-between;font-family:'DM Sans',sans-serif;
    font-size:15px;font-weight:600;padding:14px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .list-toggle .count{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);font-weight:400;margin-left:auto;margin-right:12px;}
  .list-toggle .arrow{transition:transform .3s;color:var(--muted);}
  .list-toggle.open .arrow{transform:rotate(180deg);}
  .list{max-height:0;overflow:hidden;transition:max-height .5s ease;}
  .list.open{max-height:none;}

  .add-form{display:flex;gap:8px;padding:14px 2px;border-bottom:1px solid var(--line);align-items:center;}
  .add-form input{background:var(--night-2);border:1px solid var(--line);color:var(--cream);
    border-radius:11px;padding:11px 12px;font-family:'DM Sans',sans-serif;font-size:14px;min-width:0;outline:none;}
  .add-form input:focus{border-color:var(--amber);}
  .add-form input.city{flex:1;}
  .add-form input.km{width:66px;text-align:center;font-family:'Space Mono',monospace;}
  .add-form button{flex:none;background:transparent;border:1px solid var(--amber);color:var(--amber);
    border-radius:11px;width:46px;height:44px;font-size:22px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .add-form button:active{background:rgba(244,185,66,.15);}

  .row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);}
  .row .tick{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--night-3);
    background:none;cursor:pointer;color:var(--rose);display:flex;align-items:center;justify-content:center;transition:.2s;}
  .row.done .tick{background:rgba(255,122,138,.15);border-color:transparent;}
  .row .tick svg{width:14px;height:14px;opacity:0;transition:opacity .2s;}
  .row.done .tick svg{opacity:1;}
  .row .name{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(138,143,176,.5);}
  .row .km{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--muted);flex:none;}
  .row .maps,.row .del{flex:none;color:var(--muted);text-decoration:none;padding:4px;display:flex;
    background:none;border:none;cursor:pointer;}
  .row .del{color:rgba(255,122,138,.55);}
  .row .maps svg,.row .del svg{width:17px;height:17px;}

  .footer{margin-top:26px;}
  .backup{display:flex;gap:10px;margin-bottom:16px;}
  .backup button{flex:1;background:var(--night-2);border:1px solid var(--line);color:var(--cream);
    border-radius:13px;padding:13px 8px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s;}
  .backup button:active{background:var(--night-3);}
  .backup svg{width:16px;height:16px;}
  .foot-center{text-align:center;}
  .reset{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px;text-decoration:underline;text-underline-offset:3px;}
  .signature{margin-top:12px;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--muted);
    text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;}
  .signature .orange{flex:none;}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
    background:var(--night-3);color:var(--cream);border:1px solid var(--line);padding:12px 18px;border-radius:12px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:60;box-shadow:0 12px 30px -12px rgba(0,0,0,.8);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .hearts span{position:absolute;top:-30px;font-size:20px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:0;}}

  @media (prefers-reduced-motion:reduce){
    .cell.flapping{animation:none;}.bar>span{transition:none;}.hearts{display:none;}
  }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Para onde hoje</div>
    <h1>Nosso próximo <em>passeio</em></h1>
    <p class="sub">Deixa a sorte escolher o destino da vez. É só puxar a alavanca.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-top">
      <span><b id="p-done">0</b> de <b id="p-total">0</b> cidades <span class="heart">visitadas</span></span>
      <span id="p-pct">0%</span>
    </div>
    <div class="bar"><span id="p-bar"></span></div>
  </div>

  <section class="board" aria-live="polite">
    <div class="board-label">Destino sorteado</div>
    <div class="flaps" id="flaps"></div>
    <div class="board-meta" id="meta"></div>
    <div class="board-empty" id="empty"></div>
  </section>

  <div class="filter">
    <div class="filter-head">
      <label for="range">Distância máxima</label>
      <span class="val" id="range-val">75 km</span>
    </div>
    <input type="range" id="range" min="10" max="200" value="75" step="1">
    <div class="range-scale"><span id="range-min">10 km</span><span id="range-max">200 km</span></div>
    <div class="eligible" id="eligible"></div>
  </div>

  <button class="draw" id="draw">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3l-6.5 6.5"/><path d="M21 3v5"/><path d="M21 3h-5"/><circle cx="9" cy="15" r="6"/></svg>
    Sortear passeio
  </button>

  <div class="actions" id="actions">
    <a class="btn-route" id="route" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4"/></svg>
      Ver rota
    </a>
    <button class="btn-visit" id="visit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg>
      Já fomos
    </button>
  </div>

  <section class="list-section">
    <button class="list-toggle" id="list-toggle" aria-expanded="false">
      Todas as cidades <span class="count" id="list-count"></span>
      <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="list" id="list">
      <div class="add-form">
        <input class="city" id="add-city" type="text" placeholder="Nova cidade" autocomplete="off">
        <input class="km" id="add-km" type="number" inputmode="decimal" placeholder="km">
        <button id="add-btn" aria-label="adicionar cidade">+</button>
      </div>
      <div id="rows"></div>
    </div>
  </section>

  <div class="footer">
    <div class="backup">
      <button id="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Salvar backup
      </button>
      <button id="import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/></svg>
        Restaurar backup
      </button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <div class="foot-center">
      <button class="reset" id="reset">Voltar à lista original</button>
      <p class="signature">
        <svg class="orange" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="14" r="8" fill="#e88a2a"/><circle cx="12" cy="14" r="8" fill="none" stroke="#c9701c" stroke-width="1"/><path d="M12 6c1.5-1.6 3.4-1.9 4.6-1.4-.2 1.3-1.4 2.7-3 3" fill="#7f9a5a" stroke="#5f7a3f" stroke-width="1" stroke-linejoin="round"/></svg>
        feito pra gente viajar mais
      </p>
    </div>
  </div>

  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

<script>

  const KEY="nossos_passeios_cities_v2";
  const OLD_KEY="nossos_passeios_v1";
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let cities=loadCities();

  function loadCities(){

      const raw=localStorage.getItem(KEY);
      if(raw){ const c=JSON.parse(raw); if(Array.isArray(c)&&c.length) return c; }
      const old=localStorage.getItem(OLD_KEY);
      if(old){ const vis=JSON.parse(old)||{}; return SEED.map(c=>({...c,visitado:!!vis[c.cidade]})); }
    }catch(e){}
    return SEED.map(c=>({...c}));
  }
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(cities)); }catch(e){} }

  const $=id=>document.getElementById(id);
  const flapsEl=$("flaps"),metaEl=$("meta"),emptyEl=$("empty");
  const rangeEl=$("range"),rangeVal=$("range-val"),eligibleEl=$("eligible");
  const drawBtn=$("draw"),actionsEl=$("actions"),routeEl=$("route"),visitBtn=$("visit");
  const rowsEl=$("rows"),listEl=$("list"),listToggle=$("list-toggle"),listCount=$("list-count");
  let current=null,spinning=false;

  function toast(msg){
    const t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
  }

  function refreshRangeBounds(){
    if(!cities.length) return;
    const kms=cities.map(c=>c.km);
    const lo=Math.floor(Math.min(...kms)), hi=Math.ceil(Math.max(...kms));
    rangeEl.min=lo; rangeEl.max=hi;
    $("range-min").textContent=lo+" km"; $("range-max").textContent=hi+" km";
    if(+rangeEl.value<lo) rangeEl.value=lo;
    if(+rangeEl.value>hi) rangeEl.value=hi;
  }
  function updateProgress(){
    const done=cities.filter(c=>c.visitado).length, total=cities.length;
    const pct=total?Math.round(done/total*100):0;
    $("p-done").textContent=done; $("p-total").textContent=total;
    $("p-pct").textContent=pct+"%"; $("p-bar").style.width=pct+"%";
  }
  function eligible(){ const max=+rangeEl.value; return cities.filter(c=>!c.visitado&&c.km<=max); }
  function updateEligible(){
    rangeVal.textContent=rangeEl.value+" km";
    const n=eligible().length;
    eligibleEl.innerHTML=n>0
      ? `<b>${n}</b> ${n===1?"cidade nova":"cidades novas"} até ${rangeEl.value} km`
      : `Nenhuma cidade nova até ${rangeEl.value} km — aumente a distância`;
    drawBtn.disabled=n===0||spinning;
  }

  const CHARSET="ABCDEFGHIJKLMNOPQRSTUVWXYZÁÃÂÀÉÊÍÓÔÕÚÇ-";
  function buildCells(text){
    flapsEl.innerHTML="";
    return [...text.toUpperCase()].map(ch=>{
      const cell=document.createElement("div");
      if(ch===" "){cell.className="cell space";flapsEl.appendChild(cell);return null;}
      cell.className="cell";cell.textContent=ch;flapsEl.appendChild(cell);
      return {el:cell,target:ch};
    }).filter(Boolean);
  }
  const rand=s=>s[Math.floor(Math.random()*s.length)];

  function reveal(city){
    current=city; metaEl.innerHTML=""; emptyEl.style.display="none";
    const cells=buildCells(city.cidade);
    if(reduceMotion){ showMeta(city); showActions(city); updateEligible(); return; }
    const settleAt=cells.map((_,i)=>8+i*3+Math.floor(Math.random()*4));
    let tick=0;
    const iv=setInterval(()=>{
      let allDone=true;
      cells.forEach((c,i)=>{
        if(tick>=settleAt[i]){c.el.textContent=c.target;return;}
        allDone=false; c.el.textContent=rand(CHARSET);
        c.el.classList.remove("flapping");void c.el.offsetWidth;c.el.classList.add("flapping");
      });
      tick++;
      if(allDone){clearInterval(iv);spinning=false;showMeta(city);showActions(city);updateEligible();}
    },55);
  }
  function tempoEstimado(km){
    const min=Math.round(km/52*60/5)*5;
    if(min<60) return min+" min";
    const h=Math.floor(min/60),m=min%60;
    return m?`${h}h${String(m).padStart(2,"0")}`:`${h}h`;
  }
  function showMeta(city){
    metaEl.innerHTML=
      `<span class="chip"><span class="u">a</span> ${city.km} km</span>`+
      `<span class="chip"><span class="u">≈</span> ${tempoEstimado(city.km)} <span class="u">de carro</span></span>`;
    requestAnimationFrame(()=>metaEl.querySelectorAll(".chip").forEach((c,i)=>setTimeout(()=>c.classList.add("show"),i*90)));
  }
  const mapsUrl=city=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(city.cidade+", SP, Brasil");
  function heartFilled(){return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"/></svg>`;}
  function heartOutline(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg>`;}
  function showActions(city){
    routeEl.href=mapsUrl(city);
    visitBtn.innerHTML=city.visitado?`${heartFilled()} Já fomos ✓`:`${heartOutline()} Já fomos`;
    actionsEl.classList.add("show");
  }

  function sortear(){
    if(spinning) return;
    const pool=eligible();
    if(!pool.length){
      flapsEl.innerHTML="";metaEl.innerHTML="";actionsEl.classList.remove("show");
      emptyEl.style.display="block";
      emptyEl.textContent=cities.length&&cities.every(c=>c.visitado)
        ? "Vocês já foram a todas as cidades da lista. Que casal! ✦"
        : "Já visitaram tudo até essa distância. Puxa o slider pra mais longe 😉";
      return;
    }
    spinning=true;drawBtn.disabled=true;actionsEl.classList.remove("show");
    reveal(pool[Math.floor(Math.random()*pool.length)]);
  }

  function rainHearts(){
    if(reduceMotion) return;
    const box=$("hearts"),em=["❤️","💛","✨"];
    for(let i=0;i<14;i++){
      const s=document.createElement("span");s.textContent=em[i%em.length];
      s.style.left=Math.random()*100+"%";s.style.animationDuration=(1.6+Math.random()*1.4)+"s";
      s.style.animationDelay=(Math.random()*.3)+"s";s.style.fontSize=(14+Math.random()*16)+"px";
      box.appendChild(s);setTimeout(()=>s.remove(),3200);
    }
  }
  function toggleVisit(city){
    const was=city.visitado; city.visitado=!city.visitado;
    persist();updateProgress();renderRows();updateEligible();
    if(current) showActions(current);
    if(!was) rainHearts();
  }

  function addCity(){
    const nameEl=$("add-city"),kmEl=$("add-km");
    const name=nameEl.value.trim();
    const km=parseFloat((kmEl.value+"").replace(",","."));
    if(!name){ toast("Escreva o nome da cidade"); nameEl.focus(); return; }
    if(!(km>0)){ toast("Coloque a distância em km"); kmEl.focus(); return; }
    if(cities.some(c=>c.cidade.toLowerCase()===name.toLowerCase())){ toast("Essa cidade já está na lista"); return; }
    cities.push({cidade:name,km:Math.round(km*10)/10,visitado:false});
    cities.sort((a,b)=>a.km-b.km);
    persist();refreshRangeBounds();updateProgress();renderRows();updateEligible();
    nameEl.value="";kmEl.value="";nameEl.focus();
    toast(`${name} adicionada ✦`);
  }
  function removeCity(city){
    if(!confirm(`Remover "${city.cidade}" da lista?`)) return;
    cities=cities.filter(c=>c!==city);
    if(current===city){ current=null; actionsEl.classList.remove("show"); flapsEl.innerHTML=""; metaEl.innerHTML=""; }
    persist();refreshRangeBounds();updateProgress();renderRows();updateEligible();
  }

  function renderRows(){
    rowsEl.innerHTML="";
    const sorted=[...cities].sort((a,b)=>a.km-b.km);
    sorted.forEach(city=>{
      const row=document.createElement("div");
      row.className="row"+(city.visitado?" done":"");
      row.innerHTML=
        `<button class="tick" aria-label="marcar visitada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>`+
        `<span class="name">${city.cidade}</span>`+
        `<span class="km">${city.km} km</span>`+
        `<a class="maps" href="${mapsUrl(city)}" target="_blank" rel="noopener" aria-label="rota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></a>`+
        `<button class="del" aria-label="remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button>`;
      row.querySelector(".tick").addEventListener("click",()=>toggleVisit(city));
      row.querySelector(".del").addEventListener("click",()=>removeCity(city));
      rowsEl.appendChild(row);
    });
    const done=cities.filter(c=>c.visitado).length;
    listCount.textContent=`${done}/${cities.length}`;
  }

  function exportBackup(){
    try{
      const blob=new Blob([JSON.stringify(cities,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="nossos_passeios_backup.json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast("Backup salvo ✦");
    }catch(e){ toast("Não consegui salvar o backup aqui"); }
  }
  function importBackup(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!Array.isArray(data)||!data.every(c=>c&&typeof c.cidade==="string"&&typeof c.km==="number"))
          throw new Error("formato");
        cities=data.map(c=>({cidade:c.cidade,km:c.km,visitado:!!c.visitado}));
        persist();refreshRangeBounds();updateProgress();renderRows();updateEligible();
        current=null;actionsEl.classList.remove("show");flapsEl.innerHTML="";metaEl.innerHTML="";emptyEl.style.display="none";
        toast(`Backup restaurado — ${cities.length} cidades`);
      }catch(e){ toast("Arquivo inválido. Use um backup deste app."); }
    };
    reader.readAsText(file);
  }

  rangeEl.addEventListener("input",updateEligible);
  drawBtn.addEventListener("click",sortear);
  visitBtn.addEventListener("click",()=>{ if(current) toggleVisit(current); });
  $("add-btn").addEventListener("click",addCity);
  $("add-city").addEventListener("keydown",e=>{ if(e.key==="Enter") $("add-km").focus(); });
  $("add-km").addEventListener("keydown",e=>{ if(e.key==="Enter") addCity(); });
  listToggle.addEventListener("click",()=>{
    const open=listEl.classList.toggle("open");
    listToggle.classList.toggle("open",open);
    listToggle.setAttribute("aria-expanded",open);
  });
  $("export").addEventListener("click",exportBackup);
  $("import").addEventListener("click",()=>$("import-file").click());
  $("import-file").addEventListener("change",e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=""; });
  $("reset").addEventListener("click",()=>{
    if(!confirm("Voltar à lista original da planilha? Isso descarta as cidades e marcações atuais.")) return;
    cities=SEED.map(c=>({...c}));
    persist();refreshRangeBounds();updateProgress();renderRows();updateEligible();
    current=null;actionsEl.classList.remove("show");flapsEl.innerHTML="";metaEl.innerHTML="";emptyEl.style.display="none";
  });

  refreshRangeBounds();updateProgress();renderRows();updateEligible();
})();
</script>
</body>
</html>
